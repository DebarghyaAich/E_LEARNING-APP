server:
  port: 8085

spring:
  application:
    name: InteractionService

  datasource:
    url: jdbc:postgresql://localhost:5432/elearning-interaction
    username: postgres
    password: debarghya

  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
