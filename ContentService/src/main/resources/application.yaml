server:
  port: 8083
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 2048MB

spring:
  application:
    name: ContentService

  servlet:
    multipart:
      enabled: true
      max-file-size: 2048MB
      max-request-size: 2048MB

  datasource:
    url: jdbc:postgresql://localhost:5432/elearning-content
    username: postgres
    password: debarghya

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: admin12345
  bucket-name: content-files

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
