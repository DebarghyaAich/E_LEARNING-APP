server:
  port: 8082
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 2048MB

spring:
  application:
    name: CourseService

  servlet:
    multipart:
      enabled: true
      max-file-size: 2048MB
      max-request-size: 2048MB

  datasource:
    url: jdbc:postgresql://localhost:5432/elearning-course
    username: postgres
    password: debarghya

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: admin12345
  bucket-name: course-thumbnail

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
